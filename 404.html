<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f3d2e, #1b5a49);
      color: #f4f1ea;
      font-family: 'Cairo', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem 2.5rem;
      max-width: 500px;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    a {
      display: inline-block;
      margin-top: 1rem;
      text-decoration: none;
      color: #102a20;
      background: #d7b45d;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      font-weight: 700;
      transition: 0.2s ease;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>الصفحة غير موجودة</h1>
    <p>الصفحة التي تبحث عنها غير موجودة. الرجاء العودة إلى الصفحة الرئيسية.</p>
    <a href="/quran-library/">العودة إلى الموقع</a>
  </div>
</body>
</html>
